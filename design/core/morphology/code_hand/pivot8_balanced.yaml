# A design variant, not the prototype CAD: the production linkage search's balanced finger with every pivot
# housing at 8 mm, |OC| 84-91 mm, the two pads' mounting offsets equal and both pads 3 mm thick
# (scripts/optimize/linkage/config_pivot8.yaml, preset search, portfolio_001 balanced: run_009 candidate 2099).
# Lengths are the study's, rounded to its 0.1 mm prototyping resolution. Layout, FE axis, thumb and actuator
# zeros are the prototype's (base); the CAD has not been changed to this finger.
base: prototype.yaml
finger:
  a_x_mm: 37.2
  a_z_mm: 0.0
  ap_x_mm: 40.1
  ap_z_mm: 13.2
  apb_mm: 31.8
  abp_mm: 24.2
  bp_x_mm: -8.5
  bp_z_mm: 6.6
  c_x_mm: 21.9
  c_z_mm: 0.0
  pip_servo_tilt_deg: 15.0
pads:
  # Proximal: 35.6 mm laid from A'' (A'_x + 5.0) toward O. Distal: 33.8 mm from C (B + 21.9) back to
  # B'' (B'_x - 3.4, i.e. B - 11.9).
  proximal_start_mm: 9.5
  proximal_end_mm: 45.1
  distal_start_mm: -11.9
  distal_end_mm: 21.9
  mount_offset_mm: 4.0
  thickness_mm: 3.0
  # Not a study variable: the XM335 case width (19 mm), a placeholder until the pad module is chosen.
  width_mm: 19.0
