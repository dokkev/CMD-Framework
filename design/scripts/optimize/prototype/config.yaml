# CoDe prototype optimization (design/SSoT/problem_formulation.md A.5).
#
#   python scripts/optimize/run.py scripts/optimize/prototype/config.yaml
#
# Designs the finger that gets built. Kept apart from the study
# (scripts/study/): no rule or result crosses between the two (README.md,
# "Two optimizations: prototype and study"). For another condition, write a
# file with `base: config.yaml` and the entries it changes.
#
# Every entry is required unless marked optional; an unknown one is an
# error. Lengths in mm, angles in degrees, ranges [min, max] (null: no limit;
# [a, a] fixes a value).

mechanism: linkage                # CoDe (crossed four-bar); runs go to output/linkage/<config name>/
profile: prototype

# 1. Goal: what the finger must do and carry ----------------------------------

goal:
  motion:
    # q_req: every pose of [0, q_req] must be valid (A.4) and meet the
    # transmission constraints below.
    required_flexion_deg: 150

  # Both on one line in the extended pose (A.5):
  #   joint_axes     A and B on their phalanges' axes (A_z = B_z = 0).
  #   contact_faces  the two contact faces at one depth below their link
  #                  lines (mount_offset_mm + height_mm equal).
  # The run first checks that the least pads can be aligned and fit on one
  # line, and stops with a warning if not.
  alignment:
    joint_axes: true
    contact_faces: true

  # The contact pads (C): a block mount_offset_mm below its link line (O-A,
  # B-C), height_mm thick; its length and ends are searched.
  pads:
    proximal:
      length_mm: [0, null]        # [least, most] (null most: the finger's). No least: the cylinder
                                  # coverage keeps the pads matched; the front shows what each length costs
      mount_offset_mm: [0, 10]    # searched depth of the mounting surface
      height_mm: 4
    distal:
      length_mm: [0, null]
      mount_offset_mm: [0, 10]
      height_mm: 4

  # The morphology's size (m in A.2): L_f, and the phalanges' shares rho_i.
  link:
    finger_length_mm: [84, 91]    # |OC| extended
    proximal_length_ratio: [null, null]
    distal_length_ratio: [null, null]

  # The CFL's transmission constraints on [0, q_req] (A.5.2).
  transmission:
    angle_deg: [30, 150]          # transmission angle gamma at B'
    ma_min: 0.2                   # MA_wc >= ma_min (null: none)

  # The actuators (A).
  hardware:
    pip_servo:
      model: xm335                # core.hardware.ACTUATORS
      tilt_angle_deg: [15, 15]    # dorsal tilt of the body from -X (alpha_2)
    mcp_servo:
      model: xm335

  # Self-collision (A.4): every pair is checked (touching allowed) but a
  # pivot and the actuator housing on it, and parts in other lateral layers
  # (core.optimization.linkage.config.COLLISION_DEFAULTS). Sizes include
  # their tolerances.
  collision:
    param:
      pivot_diameter_mm:          # the prototype's pins (2026-11-19)
        a: 8
        a_prime: 8
        b: 8
        b_prime: 8


# 2. Solver: how the designs are searched -------------------------------------

solver:
  # Both maximized (A.5.4): the cylinder-based pad coverage over Q_eval and
  # the worst-case mechanical advantage over [0, q_req].
  objectives:
    - c_pad_mean
    - ma_wc

  # Search limits for what no requirement bounds (A' and B' relative to A
  # and B; the pads' ends past A' and B'). Keep them wide: the run reports
  # a front sitting on one.
  search_bounds:
    ap_from_a_x_mm: [-20, 30]
    ap_from_a_z_mm: [0, 25]
    bp_from_b_x_mm: [-50, 20]
    bp_from_b_z_mm: [-60, 80]
    app_offset_mm: [-60, 60]
    bpp_offset_mm: [-60, 60]

  sampling:
    flexion_step_deg: 1.0         # uniform q2 grid of the motion
    verify_step_deg: 0.05         # the front re-checked on this grid

  prototyping_resolution_mm: 0.1  # every dimension rounded to it

  optimizer:
    # output/linkage/<config name>/<preset>/:
    #   quick        a look in about a minute
    #   search       to settle a design (about 15 min)
    #   convergence  until the front levels off (about 2 h)
    preset: convergence
    presets:
      quick:
        algorithm: nsga2
        population: 200
        generations: 300
        seeds: [0]
      search:
        algorithm: [nsga2, smsemoa]   # each run with every seed, merged into one verified front
        population: 200
        generations: 1000
        seeds: [0, 1, 2]
      convergence:
        algorithm: [nsga2, smsemoa]
        population: 200
        generations: 3000
        seeds: [0, 1, 2]
    # Feasible designs of this goal (scripts/optimize/sample_seeds.py).
    warm_start:
      - output/linkage/config/samples/seeds.csv
