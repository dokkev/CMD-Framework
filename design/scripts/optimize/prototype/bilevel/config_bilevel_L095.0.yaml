# Bi-level lower level at L_f = 95.0 ± 0.5 mm (docs/experimental/bilevel_hand.md).
#   python scripts/optimize/sample_seeds.py scripts/optimize/prototype/bilevel/config_bilevel_L095.0.yaml 200000 1000 0 output/linkage/config/samples/seeds.csv
#   python scripts/optimize/run.py scripts/optimize/prototype/bilevel/config_bilevel_L095.0.yaml
base: ../config_bilevel.yaml
goal:
  link:
    finger_length_mm: [94.5, 95.5]
solver:
  optimizer:
    warm_start:
      - output/linkage/config_bilevel_L095.0/samples/seeds.csv
