# The production CoDe finger study (config.yaml) at |OC| 84-91 mm (config.yaml: 90-100) with both
# pads 3 mm thick (config.yaml: 4 mm). Its 8 mm pivots are config.yaml's own since 2026-11-19, so
# they are no longer set here.
#
#   python scripts/optimize/run.py scripts/optimize/prototype/config_pivot8.yaml
base: config.yaml
goal:
  pads:
    proximal:
      height_mm: 3
    distal:
      height_mm: 3
  link:
    finger_length_mm: [84, 91]
solver:
  optimizer:
    preset: search
