# Prototype v1: config.yaml's goal with the pad coverage C_pad as the one
# objective (MA_wc stays only the floor goal.transmission.ma_min). A variant
# of the problem formulation's two objectives (A.5.4), to see how far the
# coverage alone goes.
#
#   python scripts/optimize/run.py scripts/optimize/prototype/config_v1.yaml
base: config.yaml
# None of config.yaml's CAD-fitted bounds (2026-11-19): the pivots' shares
# and the pads' ends near their pivots are left free; the finger stays about 90 mm.
goal:
  link:
    oa_ratio: [null, null]
    bc_ratio: [null, null]
  pads:
    proximal:
      pivot_gap_max_mm: null
      mount_offset_mm: [0, 0]     # the pad on its link line (no spacer)
    distal:
      pivot_gap_max_mm: null
      mount_offset_mm: [0, 0]
solver:
  objectives:
    - c_pad_mean
  optimizer:
    presets:
      quick:
        algorithm: ga
        population: 200
        generations: 300
        seeds: [0]
      search:
        algorithm: [ga, nsga2]
        population: 200
        generations: 1000
        seeds: [0, 1, 2]
      convergence:
        algorithm: [ga, nsga2]
        population: 200
        generations: 3000
        seeds: [0, 1, 2]
