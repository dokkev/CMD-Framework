# RCJ (equal rollers rolling without slip; the servo on the proximal roller's
# centre A drives the carrier A-B, k = 2), its servo's tilt searched in 0-45
# deg with the rest (native, 2026-11-19). Ideal no-slip kinematics: the crossed
# cables are not modelled, so every design is provisional.
base: base.yaml
mechanism: rcj
goal:
  hardware:
    pip_servo:
      tilt_angle_deg: [0, 45]
