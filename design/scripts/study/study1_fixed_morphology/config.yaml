references: scripts/study/study2_morphology_adaptation/references_native.yaml
# Study 1: contact accommodation at a fixed morphology. Every reference hand
# (references_native.yaml: each architecture's own design under the study's
# goal) carries every module pair of the catalog (modules.yaml), each at
# every required flexion. Paths are from the repository root.
#
#   python scripts/study/study1_fixed_morphology/run.py
modules: scripts/study/study1_fixed_morphology/modules.yaml
# native (2026-11-19): each architecture's own design; the matched references
# (all built to the CoDe prototype's morphology) are kept, not run.
kinds: [native]
# Each assembly is evaluated asking each of these (deg): reached, and each
# module usable there.
required_flexion_deg: [90, 120, 150]
workers: 8
output: output/study/study1_fixed_morphology_native

# The tilt sensitivity: each native design with its servo held at other tilts,
# the rest of it unchanged (no longer that tilt's native design), beside the
# design at its own tilt (include_reference).
servo_tilt_sweep:
  angles_deg: [0, 15, 30, 45]
  include_reference: true
  references: [cfl_native_q90, 2r_dd_native_q90, 2r_remote_native_q90, rcj_native_q90,
               cfl_native_q120, 2r_dd_native_q120, 2r_remote_native_q120, rcj_native_q120,
               cfl_native_q150, 2r_dd_native_q150, 2r_remote_native_q150, rcj_native_q150]
