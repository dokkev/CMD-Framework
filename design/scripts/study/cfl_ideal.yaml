# The idealized CFL: the crossed four-bar without its PIP servo body, driven
# at A' from elsewhere (as the idealized 2R and RCJ), so nothing of the servo
# is checked; A''s pin housing, the links and the transmission (gamma, MA_wc)
# stay. The kinematic bound of the four-bar; an upper bound, reported apart.
base: base.yaml
mechanism: linkage_idealized
goal:
  hardware:
    pip_servo:
      tilt_angle_deg: [15, 15]    # unused without the body; kept as cfl_tilt15's
