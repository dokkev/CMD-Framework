# Active Studies 1-2 references. Historical references.yaml is retained for frozen studies.
# Study 2's reference hands (E0, Q0, A0). Paths are from the repository root.
#
# Matched (the primary result): one external morphology for every mechanism,
# the current prototype's (report/legacy/prototype.md): finger length, the two
# contact-bearing spans and the articulation station. Each mechanism is built
# to it once, keeping its own architecture (partitions.py, `template`):
#   - CoDe: the prototype itself (its linkage and servo on A');
#   - 2R-DD, belt 2R: E fixes the 2R; the belt's servo where CoDe's A' is;
#   - RCJ: the smallest rollers its hardware allows.
# Each takes its mechanism file (scripts/study/<mechanism>.yaml: goal, actuation,
# rules), its servo tilt held at tilt_deg.
#
# The prototype's design vector is held here (tracked), not read from an
# optimizer output: the reference is an input of the study and does not move
# when a portfolio is rerun. Its order is the linkage's variable_names.
morphology:
  id: prototype
  mechanism: linkage
  config: scripts/study/cfl.yaml
  tilt_deg: 15                    # the servo tilt held (the mechanism file searches it)
  x: [35.7, 67.2, 0.0, 37.5, 12.4, 60.5, 6.5, 15.0, 22.8, 0.0, 5.8, 0.7, 3.0, 3.0]
  # Geometry provenance below is historical; nominal servo tilt is now CAD-derived 15 degrees.
  provenance:
    run: output/servo_close/linkage/proto_tilt10_align/run_004
    candidate: 2113
    portfolio: output/servo_close/linkage/proto_tilt10_align/portfolio_001
    role: balanced
    formulation: linkage-v12
    commit: 73340852fc0832024c077d1ff5b32b7a5ce2108d
    document: report/legacy/prototype.md

matched:
  - {id: code_matched, config: scripts/study/cfl.yaml, tilt_deg: 15}
  - {id: 2r_dd_tilt0_matched, config: scripts/study/2r_dd.yaml, tilt_deg: 0}
  # Matched to the prototype's A' (2026-11-20: the study's 2R-remote fixes its servo pose; the
  # matched reference keeps the window it was built in).
  - {id: belt_2r_matched, config: scripts/study/2r_remote.yaml, tilt_deg: 15,
     set: ["solver.search_bounds.ap_from_a_x_mm=[-20, 30]", "solver.search_bounds.ap_from_a_z_mm=[0, 25]"]}
  - {id: rcj_tilt0_matched, config: scripts/study/rcj.yaml, tilt_deg: 0}
  # No roller wall, bearing or cable retention is modelled: an upper bound,
  # reported apart from the rest.
  - {id: rcj_ideal_matched, config: scripts/study/rcj_ideal.yaml, upper_bound: true}
  - {id: code_ideal_matched, config: scripts/study/cfl_ideal.yaml, upper_bound: true}


# Native archives remain historical and are not re-labelled as nominal-15 designs.
native: []
