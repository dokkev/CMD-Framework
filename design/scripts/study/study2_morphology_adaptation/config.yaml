# Study 2: morphology adaptation for contact accommodation. Paths are from the
# repository root.
#
#   python scripts/study/study2_morphology_adaptation/run.py [config.yaml]
references: scripts/study/study2_morphology_adaptation/references_native.yaml
targets: scripts/study/study2_morphology_adaptation/targets.yaml
# native (2026-11-19): each architecture's own design; the matched references
# (all built to the CoDe prototype's morphology) are kept, not run.
kinds: [native]
# The required flexions q_req each adaptation is searched at (as Study 1's).
required_flexion_deg: [90, 120, 150]
# Every change is normalized by the reference finger's length (2026-11-06).
# Level 2 moves each external descriptor at most this far from the reference
# (the modelled envelope; the finger's length bounds widened to match).
external_range_mm: 20
# Each search (Level 1, Level 2's two): one run of the existing optimizer.
optimizer:
  algorithm: nsga2
  population: 100
  generations: 100
  # Every search runs once per seed (the optimizer's robustness); summary_best.csv
  # takes the best and counts how many seeds found one.
  seeds: [0, 1, 2]
workers: 8
output: output/study/study2_morphology_adaptation_native
# No tilt sweep: the discrete targets are the landscape's markers table
# (landscape.yaml); the tilt sensitivity is Study 1's.
