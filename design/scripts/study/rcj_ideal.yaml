# The idealized RCJ: the RCJ without its servo on A, driven from elsewhere
# (as the idealized 2R), so only the two rollers stand at the joint, each at
# least A's pin housing. The kinematic bound of the rolling contact joint,
# k = 2 as the RCJ's; no servo tilt. Ideal no-slip kinematics: the crossed
# cables are not modelled, so every design is provisional.
base: base.yaml
mechanism: rcj_idealized
