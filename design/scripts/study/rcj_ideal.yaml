# The idealized RCJ: the RCJ without its servo on A, driven from elsewhere
# (as the idealized 2R), so only the two rollers stand at the joint, each at
# least A's pin housing. The kinematic bound of the rolling contact joint
# (k = 2); an upper bound, reported apart. No servo, so no tilt.
base: base.yaml
mechanism: rcj_idealized
solver:
  # Every run of this architecture reaches its final value within 80
  # generations (2026-11-20, six runs each at q_req 120, 7 mm): stop a run once
  # its best has not improved for 150, instead of running out the 1000.
  optimizer:
    presets:
      search:
        options: {stall_generations: 150}
