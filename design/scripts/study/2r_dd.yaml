# 2R-DD: the serial 2R, its servo at the joint A. Its tilt searched in 0-45 deg
# with the rest (native, 2026-11-19).
base: base.yaml
mechanism: revolute
goal:
  hardware:
    pip_servo:
      tilt_angle_deg: [0, 45]
solver:
  # Every run of this architecture reaches its final value within 80
  # generations (2026-11-20, six runs each at q_req 120, 7 mm): stop a run once
  # its best has not improved for 150, instead of running out the 1000.
  optimizer:
    presets:
      search:
        options: {stall_generations: 150}
