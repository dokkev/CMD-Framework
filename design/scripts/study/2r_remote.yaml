# 2R-remote: the serial 2R driven through a belt from a servo on A'
# (revolute_parallel, k = 1). The belt and its 6 mm pulleys (2026-10-28) run
# in the outer layer: no collision with the pads.
#
# The PIP servo's pose is fixed (2026-11-20): its shaft A' 10 mm proximal of
# the joint A and 15 mm dorsal, tilted 15 deg, on the proximal phalanx. The
# objective does not see where the servo sits (MA = 1 by the belt, occlusion
# off), so a searched pose wandered (once past the joint, over the distal
# phalanx); this pose clears the pads, the A pin and the MCP servo of every
# native design (90/120/150) with their coverage unchanged.
base: base.yaml
mechanism: revolute_parallel
goal:
  hardware:
    pulley_radius_mm: 6
    pip_servo:
      tilt_angle_deg: [15, 15]
solver:
  search_bounds:
    ap_from_a_x_mm: [-10, -10]
    ap_from_a_z_mm: [15, 15]
