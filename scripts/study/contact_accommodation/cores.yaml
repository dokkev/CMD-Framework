# Frozen core designs. A core is one design of a finished run, held as it
# is (skeleton, joints, actuator, supports, mounting depths): only the
# contact modules change. Pick it either
#   portfolio + role       a seeds.csv row by its seed_role (best_transmission,
#                          most_pad, most_curl, balanced: the selection the
#                          run already made, scripts/optimize/run.py)
#   run + candidate        a pareto.csv row by its candidate number
#   config + x (+ overrides)  a design vector under a config file
# `mechanism`, when given, is checked against the source. Every core must be
# checked under the same physical rules (packaging, mounting policy), or the
# study stops. A role picking a design another already picked is evaluated
# once (manifest: duplicate_cores).
#
# Each architecture at the servo layouts it is compared at: CoDe at 10 deg
# (the prototype's), the 2R-DD laid back (0 deg) and standing (90 deg). CoDe
# takes four roles, the 2R-DD three: its servo drives the joint directly, so
# its torque ratio is 1 for every design and best_transmission would pick an
# arbitrary one (2026-11-05). The sources are the scripts/study runs (not run
# yet).
cores:
  - {id: code_tilt10_balanced, mechanism: linkage, portfolio: output/study/linkage/code_tilt10/portfolio_001,
     role: balanced}
  - {id: code_tilt10_most_pad, mechanism: linkage, portfolio: output/study/linkage/code_tilt10/portfolio_001,
     role: most_pad}
  - {id: code_tilt10_best_transmission, mechanism: linkage,
     portfolio: output/study/linkage/code_tilt10/portfolio_001, role: best_transmission}
  - {id: code_tilt10_most_curl, mechanism: linkage, portfolio: output/study/linkage/code_tilt10/portfolio_001,
     role: most_curl}
  - {id: 2r_dd_tilt0_balanced, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt0/portfolio_001,
     role: balanced}
  - {id: 2r_dd_tilt0_most_pad, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt0/portfolio_001,
     role: most_pad}
  - {id: 2r_dd_tilt0_most_curl, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt0/portfolio_001,
     role: most_curl}
  - {id: 2r_dd_tilt90_balanced, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt90/portfolio_001,
     role: balanced}
  - {id: 2r_dd_tilt90_most_pad, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt90/portfolio_001,
