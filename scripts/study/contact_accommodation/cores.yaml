# Frozen core designs. A core is one design of a finished run, held as it
# is (skeleton, joints, actuator, supports, mounting depths): only the
# contact modules change. Pick it either
#   portfolio + role       a seeds.csv row by its seed_role (best_transmission,
#                          most_pad, most_curl, balanced: the selection the
#                          run already made, scripts/optimize/run.py)
#   run + candidate        a pareto.csv row by its candidate number
#   config + x (+ overrides)  a design vector under a config file
# `mechanism`, when given, is checked against the source. Every core must be
# checked under the same physical rules (packaging), or the study stops.
#
# The sources below are the scripts/study runs (not run yet, 2026-11-04).
cores:
