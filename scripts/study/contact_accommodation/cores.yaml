  - {id: code_most_pad, mechanism: linkage, portfolio: output/study/linkage/code_tilt10/portfolio_001, role: most_pad}
  - {id: code_best_transmission, mechanism: linkage, portfolio: output/study/linkage/code_tilt10/portfolio_001,
     role: best_transmission}
  - {id: 2r_dd_tilt90_balanced, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt90/portfolio_001,
     role: balanced}
  - {id: 2r_dd_tilt90_most_pad, mechanism: revolute, portfolio: output/study/revolute/2r_dd_tilt90/portfolio_001,
