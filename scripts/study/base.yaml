# The paper's mechanism comparison: one goal, one search budget, every
# mechanism. Each file here extends this one and names its mechanism and
# what it changes (the PIP servo's tilt, ...):
#
#   python scripts/optimize/run.py scripts/study/<file>.yaml
#
# runs to output/study/<mechanism>/<file name>/ (run_NNN, portfolio_NNN).
# Change the goal here, for every mechanism at once, not in one file.
base: ../optimize/linkage/config.yaml
output: output/study

goal:
  motion:
    dip_flexion_deg: 120
  link:
    finger_length_mm: [80, 90]
    # No anatomical proportions: the segments and the four-bar's span are
    # left to the physical constraints (production bounds them by ratio).
    proximal_length_ratio: [null, null]
    distal_length_ratio: [null, null]
    joint_span_ratio: [null, null]
  pads:
    # Each pad's mounting depth below its reference line set, not searched:
    # 0 when the pad does not reach its own joint hardware (case A), else the
    # least depth that clears it, no deeper than that hardware reaches below
    # the line on the pad's own body (case B: CoDe's pin housings; the
    # 2R-DD's servo for its proximal pad; its distal pad hangs from a truss
    # off the output and has none, unless aligned); deeper needs a spacer and
    # is no design (case C, core.optimization.mounting). The two depths are
    # independent.
    mount_policy: shallowest_supported
    align_mount_offsets: false
    # The study's own mounting-depth range (the most allowed), set here so a
    # production change does not move it.
    proximal:
      mount_offset_mm: [0, 10]
    distal:
      mount_offset_mm: [0, 10]

solver:
  optimizer:
    preset: search
    # No warm start: the production samples were drawn under another goal.
    warm_start: []
