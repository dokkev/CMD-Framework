# Study 1: contact accommodation at a fixed morphology. Every reference hand
# (Study 2's references.yaml: the tracked morphology, each architecture built
# to it) carries every module pair of the catalog (modules.yaml), each at
# every required flexion. Paths are from the repository root.
#
#   python scripts/study/study1_fixed_morphology/run.py
modules: scripts/study/study1_fixed_morphology/modules.yaml
# matched (the primary comparison); native needs the study searches rerun
# under the current rules first.
kinds: [matched]
# Each assembly is evaluated asking each of these (deg): reached, and each
# module usable there.
required_flexion_deg: [90, 120, 150]
workers: 8
output: output/study/study1_fixed_morphology
