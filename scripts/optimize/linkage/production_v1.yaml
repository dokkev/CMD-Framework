# Production v1 (2026-10-21): the linkage study of config.yaml with every part's
# own dimensions on the 0.1 mm machining grid (B re-assembled from the rounded
# bars, see core/optimization/linkage/design.py), searched longer. Run it as a
# portfolio:
#   python scripts/optimize/run.py --mechanism linkage \
#       --config scripts/optimize/linkage/production_v1.yaml \
#       --portfolio --runs-per-algorithm 5 --output-root output/linkage/production_v1
base: config.yaml

production:
  link_length_resolution_mm: 0.1

# As run on 2026-10-21: the proximal pad ended right below A' and the PIP
# servo tilt was optimized. (Its seeds keep k_max and phi_safe with the tilt
# set to 35 deg and the pad run past A': extend_pads.py.)
optimization_parameter_bounds:
  app_offset_mm: [0.0, 0.0]
  servo_tilt_deg: [0.0, 30.0]

inputs:
  pip_servo_tilt_deg: null

# The 5 mm pads it was run with (config.yaml has since moved to 10 mm).
pad:
  proximal: {height_mm: 5.0, offset_mm: 0.0, chamfer_mm: 2.5, length_mm: null}
  distal: {height_mm: 5.0, offset_mm: 0.0, chamfer_mm: 2.5, length_mm: null}

optimizer:
  generations: 400
