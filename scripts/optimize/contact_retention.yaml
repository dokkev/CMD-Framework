# Contact-interface retention comparison (core/optimization/retention): the
# conditions every mechanism shares. Each mechanism's config.yaml extends this
# file (base:) with its own search box only. One required ROM per study:
#   python scripts/optimize/run.py --mechanism open_chain_packaged --set motion.required_rom_deg=150

motion:
  # Distal flexion (relative to the proximal segment) reached continuously from
  # extension without a collision: 90, 120, 150 or 180, each its own study.
  required_rom_deg: 120
  rom_step_deg: 1.0
  # The palm's MCP servo is checked over this MCP flexion.
  mcp_flexion_max_deg: 90
  mcp_step_deg: 1.0

requirements:
  extended_length_bounds_mm: [80.0, 110.0]   # |O tip| in the extended pose

packaging:
  pip_servo: xm335        # the distal joint's servo (2R: at A; RCJ: at the proximal roller)
  mcp_servo: xm335
  pivot_clearance_diameter_mm: 8.0
  body_clearance_mm: 1.0

hardware:
  # Rear body of the distal joint's servo in the proximal frame (+Z: dorsal).
  joint_servo_rear: [0.0, 1.0]
  # RCJ: roller radius kept beyond the servo radius for the cables (not modelled yet).
  cable_allowance_mm: 0.0

# The nominal contact modules (provisional sizes): thickness h = height_mm and
# the nominal length, fixed for the comparison and independent of the links.
# Retention is the kept area over this nominal area. No chamfer: the module is
# the 4-vertex block whose joint-facing vertices the optimizer moves.
pad:
  allow_collision_with_mcp_servo: false   # the proximal module starts past the MCP servo
  mcp_servo_clearance_mm: 1.0
  proximal: {height_mm: 5.0, offset_mm: 0.0, chamfer_mm: 0.0, length_mm: 45.0}
  distal: {height_mm: 5.0, offset_mm: 0.0, chamfer_mm: 0.0, length_mm: 45.0}

optimizer:
  algorithm: nsga2
  objectives: [proximal_retention, distal_retention]
  population_size: 200
  generations: 200
  seed: 0
