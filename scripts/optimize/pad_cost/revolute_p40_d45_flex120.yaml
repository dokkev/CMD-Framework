# Pad cost: revolute, pads 40 + 45 mm, 120 deg required (make_configs.py).
mechanism: revolute
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 120
  pads:
    proximal:
      length_mm: [40, 40]
    distal:
      length_mm: [45, 45]
  link:
    finger_length_mm: [60, 300]
solver:
  objectives:
    - finger_length
  pareto_front:
    finger_length: 300
  optimizer:
    generations: 800
    seeds:
      - 0
      - 1
      - 2
    warm_start:
      - output/revolute/revolute_p40_d45_flex180/portfolio_*/seeds.csv
      - output/revolute/revolute_p40_d45_flex150/portfolio_*/seeds.csv
