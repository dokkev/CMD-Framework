# Pad cost: linkage, pads 20 + 25 mm, 180 deg required (make_configs.py).
mechanism: linkage
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 180
  pads:
    proximal:
      length_mm: [20, 20]
    distal:
      length_mm: [25, 25]
  link:
    finger_length_mm: [60, 200]
solver:
  objectives:
    - finger_length
  pareto_front:
    finger_length: 200
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
    warm_start:
      - output/linkage/linkage_p40_d45_flex180/portfolio_*/seeds.csv
      - output/linkage/linkage_p30_d35_flex180/portfolio_*/seeds.csv
