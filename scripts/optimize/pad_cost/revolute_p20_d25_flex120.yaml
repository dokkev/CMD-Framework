# Pad cost: revolute, pads 20 + 25 mm, 120 deg required (make_configs.py).
mechanism: revolute
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 120
  pads:
    proximal:
      length_mm: [20, 20]
    distal:
      length_mm: [25, 25]
  link:
    finger_length_mm: [60, 200]
solver:
  objectives:
    - finger_length
  pareto_front:
    finger_length: 200
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
    warm_start:
      - output/revolute/revolute_p20_d25_flex150/portfolio_001/seeds.csv
