# Pad cost: linkage, pads 30 + 35 mm, 120 deg required (make_configs.py).
mechanism: linkage
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 120
  pads:
    proximal:
      length_mm: [30, 30]
    distal:
      length_mm: [35, 35]
  link:
    finger_length_mm: [60, 200]
solver:
  objectives:
    - finger_length
  pareto_front:
    finger_length: 200
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
    warm_start:
      - output/linkage/linkage_p40_d45_flex180/portfolio_*/seeds.csv
      - output/linkage/linkage_p40_d45_flex150/portfolio_*/seeds.csv
      - output/linkage/linkage_p40_d45_flex120/portfolio_*/seeds.csv
      - output/linkage/linkage_p30_d35_flex180/portfolio_*/seeds.csv
      - output/linkage/linkage_p30_d35_flex150/portfolio_*/seeds.csv
