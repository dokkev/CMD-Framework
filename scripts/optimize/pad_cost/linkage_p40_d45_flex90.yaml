# Pad cost: linkage, pads 40 + 45 mm, 90 deg required (make_configs.py).
mechanism: linkage
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 90
  pads:
    proximal:
      length_mm: [40, 40]
    distal:
      length_mm: [45, 45]
  link:
    finger_length_mm: [60, 200]
solver:
  objectives:
    - finger_length
  pareto_front:
    finger_length: 200
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
    warm_start:
      - output/linkage/linkage_p40_d45_flex120/portfolio_001/seeds.csv
