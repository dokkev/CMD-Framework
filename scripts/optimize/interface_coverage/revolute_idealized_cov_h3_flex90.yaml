# Interface coverage: revolute_idealized, interfaces 3 mm thick, 90 deg required (make_configs.py).
mechanism: revolute_idealized
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 90
  pads:
    proximal:
      length_mm: [20, null]
      height_mm: 3
    distal:
      length_mm: [20, null]
      height_mm: 3
  link:
    finger_length_mm: [99.5, 100]
    proximal_length_mm: [40, 60]
solver:
  objectives:
    - pad_coverage
  optimizer:
    generations: 300
    seeds:
      - 0
      - 1
      - 2
    warm_start:
      - output/revolute_idealized/revolute_idealized_cov_h10_flex150/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h10_flex120/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h10_flex90/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h5_flex150/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h5_flex120/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h5_flex90/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h3_flex150/portfolio_*/seeds.csv
      - output/revolute_idealized/revolute_idealized_cov_h3_flex120/portfolio_*/seeds.csv
