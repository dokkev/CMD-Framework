# Interface coverage: revolute, interfaces 5 mm thick, 120 deg required (make_configs.py).
mechanism: revolute
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 120
  pads:
    proximal:
      length_mm: [20, null]
      height_mm: 5
    distal:
      length_mm: [20, null]
      height_mm: 5
  link:
    finger_length_mm: [99.5, 100]
    proximal_length_mm: [40, 60]
  hardware:
    pip_servo:
      tilt_angle_deg: [0, 90]
solver:
  objectives:
    - pad_coverage
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
      - 2
    warm_start:
      - output/revolute/revolute_cov_h10_flex150/portfolio_*/seeds.csv
      - output/revolute/revolute_cov_h10_flex120/portfolio_*/seeds.csv
      - output/revolute/revolute_cov_h5_flex150/portfolio_*/seeds.csv
