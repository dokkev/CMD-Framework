# Interface coverage: revolute, interfaces 10 mm thick, 150 deg required (make_configs.py).
mechanism: revolute
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 150
  pads:
    proximal:
      length_mm: [20, null]
      height_mm: 10
    distal:
      length_mm: [20, null]
      height_mm: 10
  link:
    finger_length_mm: [99.5, 100]
    proximal_length_mm: [40, 60]
  hardware:
    pip_servo:
      tilt_angle_deg: [0, 90]
solver:
  objectives:
    - pad_coverage
  optimizer:
    generations: 400
    seeds:
      - 0
      - 1
      - 2
