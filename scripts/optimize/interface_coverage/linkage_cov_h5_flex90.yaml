# Interface coverage: linkage, interfaces 5 mm thick, 90 deg required (make_configs.py).
mechanism: linkage
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 90
  pads:
    proximal:
      length_mm: [0, null]
      height_mm: 5
    distal:
      length_mm: [20, null]
      height_mm: 5
  link:
    finger_length_mm: [99.5, 100]
    proximal_length_mm: [40, 60]
solver:
  objectives:
    - pad_coverage
  optimizer:
    generations: 500
    seeds:
      - 0
      - 1
      - 2
    warm_start:
      - output/linkage/linkage_cov_h10_flex150/portfolio_*/seeds.csv
      - output/linkage/linkage_cov_h10_flex120/portfolio_*/seeds.csv
      - output/linkage/linkage_cov_h10_flex90/portfolio_*/seeds.csv
      - output/linkage/linkage_cov_h5_flex150/portfolio_*/seeds.csv
      - output/linkage/linkage_cov_h5_flex120/portfolio_*/seeds.csv
