# Interface coverage: linkage, interfaces 10 mm thick, 120 deg required (make_configs.py).
mechanism: linkage
base: ../linkage/config.yaml
goal:
  motion:
    dip_flexion_deg: 120
  pads:
    proximal:
      length_mm: [0, null]
      height_mm: 10
    distal:
      length_mm: [20, null]
      height_mm: 10
  link:
    finger_length_mm: [99.5, 100]
    proximal_length_mm: [40, 60]
solver:
  objectives:
    - pad_coverage
  optimizer:
    generations: 500
    seeds:
      - 0
      - 1
      - 2
    warm_start:
      - output/linkage/linkage_cov_h10_flex150/portfolio_*/seeds.csv
